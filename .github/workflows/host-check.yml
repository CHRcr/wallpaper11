name: Windows host check

on:
  push:
    branches: [main]
    paths:
      - "host/**"
      - "app/**"
      - "tools/make-icons.ps1"
      - ".github/workflows/host-check.yml"
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Generate application icons
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools\make-icons.ps1
      - name: Check Windows host
        run: cargo check --manifest-path host/src-tauri/Cargo.toml
      - name: Install Tauri CLI
        working-directory: host
        run: npm install --no-audit --no-fund
      - name: Build portable application
        working-directory: host
        run: npm run build
      - name: Prepare portable folder
        shell: powershell
        run: |
          $package = "dist\wallpaper11"
          New-Item -ItemType Directory -Force "$package\media\music", "$package\media\video" | Out-Null
          Copy-Item "host\src-tauri\target\release\wallpaper11.exe" "$package\wallpaper11.exe"
          Copy-Item "host\media\README.txt" "$package\media\README.txt"
          Compress-Archive -Path "$package\*" -DestinationPath "dist\wallpaper11-portable.zip" -Force
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: wallpaper11-windows-${{ github.sha }}
          path: dist/wallpaper11-portable.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
