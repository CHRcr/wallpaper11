<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>wallpaper11</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 背景：用户媒体库的视频 + 兜底渐变 -->
  <div class="bg-fallback" aria-hidden="true"></div>
  <video id="bgVideo" class="bg-video" autoplay muted loop playsinline preload="auto"></video>

  <!-- 主舞台（左留 22% 避开系统图标列） -->
  <main class="stage" id="stage">

    <button class="countdown glass" id="countdown" title="点击修改高考日期">
      <span class="cd-label">距 2027 高考</span>
      <span class="cd-days" id="cdDays">···</span>
      <span class="cd-unit">天</span>
    </button>

    <div class="clock" id="clock" aria-live="off">
      <span class="clock-ampm" id="ampm" hidden>PM</span><span id="hh">--</span><span class="colon">:</span><span id="mm">--</span><span class="clock-sec" id="ss">:--</span>
    </div>

    <div class="yearblock" id="yearblock">
      <div class="yb-row">
        <span class="yb-date" id="ybDate">----年--月--日 星期-</span>
        <span class="yb-pct" id="ybPct">--%</span>
      </div>
      <div class="yb-track">
        <div class="yb-fill" id="ybFill"></div>
      </div>
    </div>

    <section class="wordcard glass" id="wordCard" aria-live="polite">
      <div class="wc-inner" id="wcInner">
        <div class="wc-head">
          <span class="wc-word" id="wcWord">abandon</span>
          <button class="wc-next" id="wcNext" title="换一个">&#10227;</button>
        </div>
        <div class="wc-pos" id="wcPos"></div>
        <ul class="wc-derivs" id="wcDerivs"></ul>
        <div class="wc-foot">
          <span class="wc-phrase" id="wcPhrase"></span>
          <span class="wc-count" id="wcCount"></span>
        </div>
      </div>
    </section>

  </main>

  <!-- 今日作业板：平时隐藏，晚自习展开 -->
  <div class="overlay" id="homeworkMask" hidden>
    <div class="hw-panel" role="dialog" aria-label="今日作业">
      <header class="hw-head">
        <div class="hw-head-left">
          <span class="hw-head-title">今日份作业</span>
          <span class="hw-head-sub">美味的小练习~</span>
        </div>
        <span class="hw-clock" id="hwClock">--:--:--</span>
        <div class="hw-actions">
          <button class="mini-btn" id="hwReplace">更换</button>
          <button class="mini-btn danger" id="hwClear2">清空</button>
          <button class="panel-close" id="hwClose" title="关闭">&#10005;</button>
        </div>
      </header>
      <div class="hw-body" id="hwBody">
        <div class="hw-empty" id="hwEmpty">
          <svg class="hw-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="9" cy="9" r="2"/>
            <path d="m21 15-4.5-4.5L6 21"/>
          </svg>
          <div class="hw-hint">把图片拖到这里，或点一下选择</div>
        </div>
        <img class="hw-img" id="hwImg" alt="今日作业" hidden draggable="false">
      </div>
    </div>
  </div>

  <!-- 工具栏（低调，靠近浮现） -->
  <nav class="toolbar" id="toolbar" aria-label="工具栏">
    <button class="tb-btn" id="btnMusic" title="音乐">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
    </button>
    <button class="tb-btn" id="btnHomework" title="今日份作业（美味的小练习~）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L6 21"/>
      </svg>
      <i class="tb-dot" id="hwDot" hidden></i>
    </button>
    <button class="tb-btn" id="btnSettings" title="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </nav>

  <!-- 设置面板 -->
  <div class="overlay" id="settingsMask" hidden>
    <div class="panel glass-strong" role="dialog" aria-label="设置">
      <header class="panel-head">
        <span>设置</span>
        <button class="panel-close" id="settingsClose" title="关闭">&#10005;</button>
      </header>
      <div class="panel-body" data-scroll-surface tabindex="0" role="region" aria-label="设置内容">
        <label class="field">
          <span class="field-name">高考日期</span>
          <input type="date" id="setExamDate">
        </label>
        <label class="field">
          <span class="field-name">倒计时标题</span>
          <input type="text" id="setExamTitle" maxlength="12" placeholder="距 2027 高考">
        </label>
        <label class="field">
          <span class="field-name">单词切换间隔（秒）</span>
          <input type="number" id="setWordInterval" min="5" max="600" step="5">
        </label>
        <label class="field">
          <span class="field-name">时间制式</span>
          <select id="setHour12">
            <option value="0">24 小时制</option>
            <option value="1">12 小时制</option>
          </select>
        </label>
        <label class="field">
          <span class="field-name">显示秒</span>
          <input type="checkbox" id="setShowSec">
        </label>
        <label class="field">
          <span class="field-name">背景视频</span>
          <select id="setBg">
            <option value="play">播放</option>
            <option value="pause">冻结为静态（最省性能）</option>
          </select>
        </label>
        <label class="field">
          <span class="field-name">界面缩放</span>
          <input type="range" id="setScale" min="0.8" max="1.4" step="0.05">
        </label>
        <div class="field bridge-field">
          <span class="field-name">Music Bridge</span>
          <div class="bridge-control">
            <span class="bridge-state checking" id="musicBridgeState"><i></i><span>检测中</span></span>
            <button class="cookie-action" id="btnCheckMusicBridge" type="button">检测</button>
            <a class="cookie-action bridge-manage" id="btnManageMusicBridge"
               href="http://127.0.0.1:16311/manage" target="_blank" rel="noopener noreferrer">管理</a>
          </div>
        </div>
        <div class="field cookie-field">
          <label class="field-name" for="setMusicCookie">网易云 Cookie</label>
          <div class="cookie-control">
            <input type="text" id="setMusicCookie" placeholder="MUSIC_U 的值；可留空" spellcheck="false">
            <button class="cookie-action" id="btnPasteMusicCookie" type="button" title="从剪贴板粘贴 Cookie">粘贴</button>
            <button class="cookie-action" id="btnTestMusicCookie" type="button" title="验证 Cookie 是否有效">验证</button>
            <button class="cookie-action" id="btnClearMusicCookie" type="button" title="清空 Cookie">清空</button>
          </div>
        </div>
        <div class="field">
          <span class="field-name">数据</span>
          <button class="mini-btn" id="btnReset">恢复默认设置</button>
        </div>
        <p class="media-note" id="mediaStatus"></p>
        <div class="field">
          <span class="field-name">项目</span>
          <a class="github-btn" id="btnOpenProject"
             href="https://github.com/CHRcr/wallpaper11"
             target="_blank" rel="noopener noreferrer"
             aria-label="在 GitHub 打开 CHRcr/wallpaper11">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.093.682-.217.682-.483 0-.237-.009-.866-.014-1.7-2.782.605-3.369-1.343-3.369-1.343-.455-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.071 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.091-.647.349-1.088.635-1.338-2.221-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.56 9.56 0 0 1 12 6.836a9.55 9.55 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.203 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.337 4.695-4.566 4.943.359.31.678.921.678 1.856 0 1.34-.012 2.421-.012 2.75 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2Z"/>
            </svg>
            <span>GitHub</span>
            <small>CHRcr/wallpaper11</small>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- 音乐播放器：右上角壁纸卡片，歌词/歌单/搜索在卡片内展开 -->
  <div class="music-dock" id="musicMask" hidden>
    <section class="mp glass-strong" id="musicPanel" aria-label="音乐播放器">
      <header class="mp-head">
        <span class="mp-kicker"><i aria-hidden="true"></i> NOW PLAYING</span>
        <div class="mp-actions">
          <button class="mp-icon-btn" id="musicSearchBtn" title="搜索网易云">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
            </svg>
          </button>
          <button class="mp-icon-btn" id="musicClose" title="收起">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m8 10 4 4 4-4"/></svg>
          </button>
        </div>
      </header>

      <div class="mp-hero">
        <div class="mp-cover-wrap" id="mpCoverWrap" title="播放 / 暂停">
          <img class="mp-cover" id="mpCover" alt="" draggable="false">
          <span class="mp-cover-state" id="mpCoverState"></span>
          <i class="mp-cover-glow" aria-hidden="true"></i>
        </div>
        <div class="mp-meta">
          <div class="mp-name" id="mpName">未在播放</div>
          <div class="mp-artist" id="mpArtist">—</div>
          <div class="mp-lrc-peek" id="mpLrcPeek">选择一首歌开始播放</div>
        </div>
      </div>

      <div class="mp-progress">
        <span class="mp-time" id="mpCur">0:00</span>
        <div class="mp-bar" id="mpBar" aria-label="播放进度">
          <div class="mp-buf" id="mpBuf"></div>
          <div class="mp-played" id="mpPlayed"></div>
        </div>
        <span class="mp-time" id="mpDur">0:00</span>
      </div>

      <div class="mp-controls">
        <button class="mp-ctl" id="mpMode" title="列表循环"></button>
        <button class="mp-ctl" id="mpPrev" title="上一首"></button>
        <button class="mp-ctl mp-play" id="mpPlay" title="播放"></button>
        <button class="mp-ctl" id="mpNext" title="下一首"></button>
        <button class="mp-ctl" id="mpLyricsToggle" title="歌词">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6h14M5 11h10M5 16h12"/><path d="M5 20h7"/></svg>
        </button>
        <button class="mp-ctl" id="mpListToggle" title="播放列表"></button>
        <span class="mp-vol">
          <button class="mp-ctl" id="mpMute" title="静音"></button>
          <input type="range" class="mp-vol-slider" id="mpVol" min="0" max="100" step="1" value="45" aria-label="音量">
        </span>
      </div>

      <div class="mp-drawer" id="mpDrawer">
        <div class="mp-lrc" id="mpLrc">
          <div class="mp-lrc-inner" id="mpLrcInner"></div>
          <div class="mp-lrc-empty" id="mpLrcEmpty" hidden></div>
        </div>
        <aside class="mp-list" id="mpList">
          <div class="mp-list-head">
            <span class="mp-list-title">播放列表 <em id="mpListCount">0</em></span>
            <span class="mp-list-btns">
              <button class="mp-list-btn mp-list-page" id="mpListPageUp" title="向上翻页" aria-label="播放列表向上翻页">&#9650;</button>
              <button class="mp-list-btn mp-list-page" id="mpListPageDown" title="向下翻页" aria-label="播放列表向下翻页">&#9660;</button>
              <button class="mp-list-btn" id="mpListRestore" hidden>恢复</button>
              <button class="mp-list-btn" id="mpListClear">清空</button>
            </span>
          </div>
          <ol class="mp-list-ol" id="mpListOl" data-scroll-surface tabindex="0" aria-label="播放列表"></ol>
        </aside>
      </div>

      <div class="mp-search" id="mpSearch" hidden>
        <div class="mp-search-bar">
          <button class="mp-search-back" id="mpSearchBack" title="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <input id="mpSearchInput" type="text" placeholder="搜索网易云音乐" autocomplete="off" spellcheck="false">
        </div>
        <div class="mp-results" id="mpResults" data-scroll-surface tabindex="0" role="region" aria-label="搜索结果"></div>
      </div>
    </section>
  </div>

  <!-- 轻提示 -->
  <div class="toast glass-strong" id="toast" hidden></div>

  <script>
    window.W11_MEDIA_LIBRARY = { music: [], backgroundUrl: '', mediaDir: 'media' };
  </script>
  <script src="media/media-library.js" onerror="this.remove()"></script>
  <script src="js/main.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
