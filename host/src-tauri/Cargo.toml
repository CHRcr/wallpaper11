[package]
name = "wallpaper11"
version = "0.1.0"
description = "Interactive classroom wallpaper for Windows Seewo displays"
authors = ["CHRcr"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "wallpaper11_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
encoding_rs = "0.8"
http = "1"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
strip = true
